[databases]
apexos = host=postgres port=5432 dbname=apexos

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_user = apex
pool_mode = transaction
default_pool_size = 25
max_client_conn = 100
max_db_connections = 25
idle_transaction_timeout = 300
query_timeout = 30
server_idle_timeout = 600
stats_period = 60
