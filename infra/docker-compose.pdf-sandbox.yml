# Overlay para runtimes Docker que admitan perfiles seccomp por servicio.
# Ejecutar desde la raiz del repositorio, junto con docker-compose.yml.
services:
  api:
    init: true
    security_opt:
      - seccomp=./infra/pdf-renderer/seccomp.json
    environment:
      PDF_WEB_ORIGIN: ${PDF_WEB_ORIGIN:?Configure el origen privado real del frontend}
      PDF_BROWSER_EXECUTABLE: /usr/bin/chromium
