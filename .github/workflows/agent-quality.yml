name: Agent quality gates

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  safe-quality:
    name: Safe ERP quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      REDIS_DISABLED: "true"
      DATABASE_URL: "postgresql://apex:local_ci_only@127.0.0.1:55432/apexos_ci"

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Git state
        run: npm run agent:git:check

      - name: Show changed files
        run: npm run agent:changes -- --base "origin/${{ github.base_ref || 'develop' }}"

      - name: Run safe quality profile
        run: npm run agent:test -- --profile safe

      - name: Generate execution report
        if: always()
        run: npm run agent:report

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-quality-report-${{ github.run_id }}
          path: .agents/reports/
          if-no-files-found: warn
          retention-days: 14
