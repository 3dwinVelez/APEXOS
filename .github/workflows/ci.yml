name: CI

on:
  push:
    branches: [main, develop, desarrollo]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Git Governance Guard
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate mandatory branch flow
        if: github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'codex/qa-')
        run: npm run governance:ci
      - name: Validate scoped promotion manifests
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'codex/qa-')
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/git-governance-guard.js ci-promotion "$PR_HEAD_SHA" "$PR_BASE_SHA" "$PR_BASE_REF" "$PR_HEAD_REF"
      - name: Run versioned scoped governance certification
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'codex/qa-')
        run: node scripts/certifications/scoped-qa-governance-local.js
      - name: Test governance guard
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'codex/qa-')
        run: node --test scripts/test/git-governance-guard.test.js

  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: TypeCheck frontend
        run: npx -p typescript tsc --noEmit --project apps/web/tsconfig.json
      - name: Lint
        run: npm run lint
      - name: Performance regression guard
        run: npm run performance:guard

  build-api:
    name: Build API
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Syntax check backend
        run: node --check apps/api/server.js
      - name: Docker build API
        run: docker build -t apex-api -f apps/api/Dockerfile apps/api
      - name: Verify certification scripts in API artifact
        run: |
          docker run --rm --entrypoint node apex-api --check scripts/certifications/service-correction-evidence-nyvora.js
          docker run --rm --entrypoint node apex-api --check scripts/certifications/platform-regression-qa.js
          docker run --rm --entrypoint node apex-api --check scripts/certifications/fixtures/nyvora-service-correction.js

  build-web:
    name: Build Web
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Next.js
        run: npm --workspace apps/web run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_WS_URL: ws://localhost:3000
      - name: Docker build Web
        run: docker build -t apex-web -f apps/web/Dockerfile .

  security-audit:
    name: Security Audit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
